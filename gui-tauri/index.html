<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>ModelLink</title>
    <script>
      // 首帧前定主题，防切换闪烁。'theme' ∈ light | dark | system（默认 system）。
      (function () {
        var p = localStorage.getItem("theme") || "system";
        var dark =
          p === "dark" ||
          (p === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        // macOS 用 Overlay 标题栏，顶栏要给红绿灯让位（index.css 的 mac: 变体）
        document.documentElement.classList.toggle("mac", /Macintosh/.test(navigator.userAgent));
      })();
    </script>
    <style>
      /* 冷启动兜底底色（与 src/index.css --bg 一致），防 WKWebView 首帧白屏。 */
      html,
      body {
        margin: 0;
        background: #f7f6f2;
      }
      html.dark,
      html.dark body {
        background: #0d0c0b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
